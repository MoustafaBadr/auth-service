version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: auth-service-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
      MYSQL_USER: app
      MYSQL_PASSWORD: app123

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: